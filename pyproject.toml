[project]
name = "mcp-continuation-replay"
version = "0.0.1"
description = "Wire-level experimental profile and reference consumer for MCP continuation replay and uncertain effects."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jason Lovell" }]
license = { file = "LICENSE" }
keywords = ["mcp", "idempotency", "interoperability", "continuation-replay", "unknown-outcome"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.10",
    "jsonschema>=4.23,<5",
    "mcp==2.2.0",  # exact SDK pin for the retained local experiment
]

[project.urls]
Repository = "https://github.com/jlov7/mcp-continuation-replay"
Issues = "https://github.com/jlov7/mcp-continuation-replay/issues"
Security = "https://github.com/jlov7/mcp-continuation-replay/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.0",
    "pyright>=1.1.414",
    "ruff>=0.9",
]

[project.scripts]
continuation-replay-fingerprint = "continuation_replay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/continuation_replay"]

[tool.hatch.build.targets.sdist]
# Retained research snapshots are tracked but match the repository-wide SQLite ignore rule.
artifacts = ["docs/**/*.sqlite3"]

[tool.hatch.build.targets.sdist.force-include]
"artifacts/evidence/retained-wire-transcript.log" = "artifacts/evidence/retained-wire-transcript.log"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".", "src"]
addopts = "-ra --strict-markers"
markers = [
    "pinned_finding(mechanism): exact observed behavior of a deliberately unsafe pinned-SDK probe",
]

# NOTE: the MCP SDK pin was resolved at Milestone A by reading the pinned
# release, not by guessing. Spec revision 2026-07-28 carries the MRTR surface
# (SEP-2322). See research/CURRENT-FINDINGS.md.

[tool.uv]
package = true

[tool.pyright]
include = ["src", "reference", "tests"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["src", "reference"]
parallel = true
sigterm = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 75
show_missing = true
